<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swap兑换界面</title>
    <!-- 链接外部CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🔄 代币兑换</h1>
        
        <!-- 第一个代币 -->
        <div class="input-area">
            <div class="label" id="labelA">Token A (输入)</div>
            <div class="input-box">
                <input type="number" id="inputA" placeholder="0.00" step="0.01">
                <span class="token-badge" id="badgeA">A</span>
            </div>
        </div>
        
        <!-- 切换按钮 -->
        <div class="switch-wrapper">
            <button class="switch-btn" id="switchBtn">⇅</button>
        </div>
        
        <!-- 第二个代币 -->
        <div class="input-area">
            <div class="label" id="labelB">Token B (输出)</div>
            <div class="input-box">
                <input type="number" id="inputB" placeholder="0.00" step="0.01" readonly>
                <span class="token-badge" id="badgeB">B</span>
            </div>
        </div>
        
        <!-- 汇率显示 -->
        <div class="rate-box">
            <p id="rateText">💰 1 A = 0.1 B</p>
        </div>
        
        <!-- 兑换按钮 -->
        <button class="swap-btn" id="swapBtn">确认兑换</button>
        
        
    </div>
    
    <!-- 链接外部JavaScript -->
    <script src="script.js"></script>
</body>
</html>
